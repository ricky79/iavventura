[project]
name = "avventura-castello"
version = "0.1.0"
description = "Avventura testuale in un castello, con motore deterministico e LLM come interprete dei comandi."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
