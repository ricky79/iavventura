# La Rocca di Serravento — dati generali della partita.
# Formato: docs/formato-mondo.md

game:
  title: La Rocca di Serravento
  summary: Un castello abbandonato, una bufera, un portone che non si riapre.
  # Esempi per l'interprete, nel formato del prompt (app/llm/prompts.py): vanno tra quelli
  # generici e il dialogo. Senza, «usa il rampino per recuperare la chiave dal pozzo» finiva sul
  # portone. Ogni modifica va verificata su tutto tests/test_ollama.py.
  examples: |-
    Oggetti: pozzo; portone; corda con gancio (corda, gancio, rampino); chiave di ferro (chiave)
    Uscite: est (Scuderia)
    Frase: usa il rampino per recuperare la chiave dal pozzo
    {"verbo": "usa", "bersaglio": "pozzo", "con": "corda con gancio"}
  intro: >
    La bufera ti ha sorpreso sul passo e l'unico riparo era la vecchia rocca
    di Serravento, abbandonata da anni. Appena entri, il portone si richiude
    alle tue spalle con un tonfo. Da questa parte non si apre.
    Dovrai trovare un'altra via d'uscita.
  start_room: cortile
  endings:
    - when: {player_in: torre}
      text: >
        Sali i gradini consumati della scala a chiocciola fino alla stanza in
        cima. Dalla finestra, oltre la bufera che si sta placando, vedi le luci
        del villaggio a valle. Una porticina dà sui camminamenti delle mura, e
        da lì una scala di pietra scende fino al sentiero. Sei libero.
    - when: {flag: caduto_nel_pozzo}
      death: true
      text: >
        Il colpo ti toglie il respiro. Il cerchio di cielo lassù si fa sempre
        più piccolo, poi scompare. La bufera continua a soffiare sul cortile
        vuoto. Sei morto.
