# Stanze della rocca. Le descrizioni citano gli arredi (scenery: true),
# mentre gli oggetti trasportabili li elenca il motore.
# Gli alias sono gli altri modi di indicare il luogo, anche chi o cosa ci si trova
# («torna al pozzo», «vai dal pellegrino»).

rooms:
  cortile:
    name: Cortile
    aliases: [pozzo]
    description: >
      Un cortile lastricato, invaso dall'edera e dalle foglie portate dal
      vento. Al centro c'è un vecchio pozzo di pietra. A nord si
      alza la torre, chiusa da una porta di ferro borchiata. A ovest una porta
      bassa dà sulla cucina, a est un arco porta alla scuderia. Alle tue spalle,
      il portone da cui sei entrato.
    variants:
      - when: {flag: torre_aperta}
        text: >
          Un cortile lastricato, invaso dall'edera e dalle foglie portate dal
          vento. Al centro c'è un vecchio pozzo con la vera di pietra. A nord,
          la porta di ferro della torre è socchiusa. A ovest una porta bassa dà
          sulla cucina, a est un arco porta alla scuderia. Alle tue spalle, il
          portone da cui sei entrato.
    exits:
      ovest: {to: cucina}
      est: {to: scuderia}
      nord:
        to: torre
        when: {flag: torre_aperta}
        otherwise: La porta della torre è chiusa a chiave.

  cucina:
    name: Cucina
    description: >
      Una cucina dal soffitto annerito dal fumo. Nel grande camino spento
      pendono ancora le catene per i paioli. Accanto al camino c'è un ceppo di
      legno, segnato da mille colpi. Il cortile è a est.
    exits:
      est: {to: cortile}

  scuderia:
    name: Scuderia
    aliases: [scuderie, stalla, pellegrino]
    description: >
      Una scuderia senza più cavalli, che sa ancora di fieno. Le poste sono
      deserte e le mangiatoie piene di polvere. Il cortile è a ovest.
    exits:
      ovest: {to: cortile}

  torre:
    name: Torre
    aliases: [scala, scale]
    description: >
      La base della torre, fredda e buia. Una scala a chiocciola sale verso
      l'alto. La porta sul cortile è a sud.
    exits:
      sud: {to: cortile}
