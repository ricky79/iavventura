# La Stella di Valdimora — dati generali della partita.
# Spec: docs/superpowers/specs/2026-09-29-valdimora-design.md. Formato: docs/formato-mondo.md
# Il terzo atto finisce aprendo la porta della cantina con la lanterna accesa (finale provvisorio:
# lo toglie l'atto 4). Dopo una morte si riprende dall'inizio dell'ultimo atto cominciato.

game:
  title: La Stella di Valdimora
  summary: >-
    Autunno 1927: una contessa che non conosci ti chiama nel suo castello di montagna.
    (In costruzione: per ora i primi tre atti.)
  intro: >
    Genova, ottobre 1927. La lettera è arrivata su carta color avorio, firmata da una contessa di
    cui non avevi mai sentito parlare: «Ho una cosa che appartiene a voi e a vostra madre. Venite a
    Valdimora, vi spiegherò ogni cosa.» Tua madre, Clara, è morta da nove anni, e di Valdimora non
    ti ha mai detto una parola. Ti ha lasciato soltanto un medaglione d'argento con una stella
    incisa. Così hai preso la corriera. L'ultimo tratto di strada sale tra i castagni sotto una
    pioggia fitta; il vetturino ti lascia davanti al castello, mette la tua valigia nella rimessa e
    riparte in fretta verso valle. Poco dopo, un boato: una frana ha chiuso la strada alle sue
    spalle. Il portone di Valdimora è socchiuso. Entri.
  start_room: atrio
  acts:
    - name: secondo atto
      when: {flag: atto_due}
    - name: terzo atto
      when: {flag: atto_tre}
  endings:
    - when: {flag: caduta_dal_balcone}
      death: true
      text: >
        La pietra cede con uno schiocco secco, e tu con lei. Per un attimo vedi la valle sotto di
        te, grigia di pioggia; poi più niente. Sei morta.
    - when: {flag: caduta_in_soffitta}
      death: true
      text: >
        Le assi marce cedono con uno schianto. Precipiti tra travi e calcinacci, e il pavimento del
        piano nobile ti viene incontro. Sei morta.
    - when: {all: [{player_in: sottotetto}, {not: {flag: asse_posata}}]}
      death: true
      text: >
        Le assi marce che hai appena attraversato scricchiolano sotto i tuoi piedi, poi cedono con uno
        schianto. Precipiti tra travi e calcinacci, giù fino al piano nobile. Sei morta.
    - when: {all: [{player_in: tetto}, {not: {flag: corda_legata}}]}
      death: true
      text: >
        Fai un passo sulle tegole bagnate, e ti scivolano via da sotto i piedi. Non c'è niente a cui
        aggrapparti. Sei morta.
    - when: {flag: atto_quattro}
      text: >
        Alle tue spalle, Ettore si schiarisce la voce. «Siete sicura di avere tutto, signorina?» Alzi
        la lanterna, e cominci a scendere. Fine del terzo atto. (Il quarto è in costruzione.)
