# I personaggi di Valdimora. Dove stanno nel primo atto: spec, sezione 2 (tabella dei personaggi);
# gli spostamenti (moves) arrivano con gli atti successivi.
# I domestici danno del voi a Irene («signorina»); la narrazione le dà del tu. Gesti e opinioni
# reciproche: docs/superpowers/specs/2026-09-29-dialoghi-design.md. Nessuno rivela i segreti degli
# atti successivi; Agnese e Corrado, però, si difendono a vicenda.

characters:
  ettore:
    name: Ettore
    article: none
    gender: m
    aliases: [maggiordomo, vecchio]
    description: >
      Un uomo alto e magro, sui settant'anni, in livrea nera. Ha gli occhi rossi di chi non dorme da
      giorni.
    location: stanza_maggiordomo
    greeting: >
      Ettore si alza a fatica dalla sedia. «Perdonate, signorina: la casa è in lutto. La contessa ci
      ha lasciati tre giorni fa. Chi siete, e chi vi manda?»
    greeting_variants:
      - when: {flag: busta_data}
        text: «Signorina Irene.» Ettore si inchina appena. «Chiedete pure. Quello che so, è vostro.»
    greeting_again: «Ancora voi, signorina? Non mi avete detto chi vi manda.»
    unknown: Ettore scuote la testa. «Su questo non so dirvi niente, signorina.»
    refuses: «No, signorina, non posso accettare.»
    gestures:
      congedo:
        text: «Andate pure, signorina. Io sono qui, se vi servo.»
      grazie:
        text: Ettore china il capo. «Non c'è di che, signorina.»
        again: «Basta così, signorina. È il mio dovere.»
      scuse:
        text: «Non avete niente da farvi perdonare, signorina.»
      come_stai:
        text: >
          «Come un vecchio che ha perso la sua padrona.» Ettore si passa una mano sugli occhi. «Ma si
          va avanti.»
        variants:
          - when: {flag: busta_data}
            text: «Meglio, da quando siete arrivata.» Per un attimo, Ettore quasi sorride.
      chi_sei:
        text: >
          «Ettore, il maggiordomo. Servo in questa casa da cinquant'anni: ho visto nascere più cose di
          quante ne ricordi.»
      scortesia:
        text: >
          Ettore si irrigidisce, ma non alza la voce. «Siete stanca e bagnata, signorina. Facciamo
          finta che non l'abbiate detto.»
    topics:
      contessa:
        name: contessa
        gender: f
        aliases: [adelaide, padrona, morte]
        text: >
          «Il cuore, dicono. Da mesi non stava bene, ma quella notte…» Ettore tace, e guarda altrove.
          «Il dottore l'ha trovata all'alba.»
        again: «Non chiedetemi di parlarne ancora, signorina. Non stanotte.»
      lettera:
        name: lettera
        gender: f
        aliases: [invito, lettera della contessa]
        text: «La contessa vi ha scritto?» Ettore tende la mano. «Posso vederla?»
        variants:
          - when: {flag: busta_data}
            text: «L'ha scritta con le ultime forze, ne sono sicuro.»
        again: "«La lettera, signorina: fatemela vedere.»"
      credenza:
        name: credenza
        gender: f
        aliases: [grappa, liquori, chiave della credenza]
        when: {flag: busta_data}
        effects:
          - give: chiave_credenza
        text: >
          «La grappa buona è nella credenza della sala da pranzo.» Ettore ti mette in mano una
          chiavina legata a un nastro. «Ecco la chiave. Ma non ditelo alla signora Livia.»
        variants:
          - when: {flag: credenza_aperta}
            text: «Avete trovato la grappa? Acqua in bocca con Livia, mi raccomando.»
        again: «La chiave ve l'ho data, signorina. Il resto è affare vostro.»
      clara:
        name: Clara
        article: none
        gender: f
        aliases: [madre, mamma, mia madre, tua madre]
        when: {flag: busta_data}
        text: >
          Ettore distoglie lo sguardo. «Non qui, signorina. Non ancora. La contessa ha voluto che le
          cose le trovaste da voi.»
        again: «Abbiate pazienza, signorina. Ogni cosa a suo tempo.»
      livia:
        name: Livia
        article: none
        gender: f
        aliases: [governante, chiavi]
        effects:
          - set_flag: ettore_garantisce
        text: >
          «Livia? Tiene le chiavi di tutto, ed è dura. Ma è onesta.» Ettore annuisce, deciso. «Se vi
          serve qualcosa da lei, una parola gliela metto io: saprà che siete chi dite di essere.»
        variants:
          - when: {flag: livia_chiave}
            text: «Visto? Livia è dura, ma è giusta.»
        again: «Le ho già parlato, signorina. State tranquilla.»
      corrado:
        name: Corrado
        article: none
        gender: m
        aliases: [nipote]
        text: >
          «Il nipote del conte. Si considera già il padrone.» Ettore abbassa la voce. «Non fidatevi
          troppo, signorina.»
        again: «Non fidatevi troppo di lui, ve l'ho detto.»
      agnese:
        name: Agnese
        article: none
        gender: f
        aliases: [dama di compagnia]
        text: >
          «La dama di compagnia della contessa. Le leggeva i romanzi, le dava le medicine. Da quando
          è morta non si stacca da lei, in cappella.»
        again: «Povera ragazza. È sempre in cappella, con la contessa.»
      ferri:
        name: dottor Ferri
        article: definite
        gender: m
        aliases: [dottore, medico, ferri]
        text: «Il dottor Ferri? Un buon medico, una volta. Ora beve più di quanto visiti.»
        again: "«Ve l'ho detto: una volta era un buon medico.»"
      frana:
        name: frana
        gender: f
        aliases: [strada, notaio]
        text: >
          «Finché non liberano la strada, qui non arriva nessuno. Nemmeno il notaio, che Livia
          aspettava per il 20.»
        again: «Ci vorranno giorni, signorina. Siamo tutti chiusi qui.»

  livia:
    name: Livia
    article: none
    gender: f
    aliases: [governante, signora livia]
    description: >
      Una donna sulla cinquantina, vestita di grigio, con un mazzo di chiavi alla cintura. Ti guarda
      come si guarda una macchia sul tappeto.
    location: ufficio_governante
    greeting: >
      «Siete voi, quella della corriera.» Livia non si alza. «La casa è in lutto, signorina. Non so
      che cosa siate venuta a cercare, ma qui non troverete niente.»
    greeting_variants:
      - when: {flag: livia_chiave}
        text: «Avete la chiave. Non toccate le cose della contessa.»
    greeting_again: «Ancora voi.» Livia non alza nemmeno gli occhi dai conti.
    unknown: «Non sono cose che vi riguardano.»
    refuses: «Tenete le vostre cose, signorina.»
    gestures:
      congedo:
        text: «Andate pure. E non toccate niente.»
      grazie:
        text: «Non ringraziatemi. Faccio il mio dovere.»
        again: «Basta ringraziare, signorina. Non serve.»
      scuse:
        text: «Le scuse non riaprono le porte, signorina.»
      come_stai:
        text: >
          «Come si sta, in una casa senza padrona.» Livia rimette in fila una penna che era già in
          fila.
        variants:
          - when: {flag: livia_chiave}
            text: «Ho dato la chiave dello scalone a una sconosciuta. Come volete che stia?»
      chi_sei:
        text: «Livia, la governante. Da trent'anni tengo in piedi questa casa.»
      scortesia:
        text: Livia ti guarda senza battere ciglio. «Ne ho sentite di peggio, e da gente migliore.»
    topics:
      scalone:
        name: scalone
        gender: m
        aliases: [piano nobile, piano di sopra, chiave dello scalone, porta]
        text: «Il piano nobile resta chiuso finché non arriva il notaio. Ordini miei.»
        variants:
          - when: {flag: livia_chiave}
            text: «Avete la chiave. Non fatemene pentire.»
        again: "«Ve l'ho già detto: finché non arriva il notaio, resta chiuso.»"
      contessa:
        name: contessa
        gender: f
        aliases: [adelaide, padrona, morte]
        text: >
          «Trent'anni al suo servizio.» Per un attimo la voce le si incrina. «Non parlo della
          contessa con gli estranei.»
        again: «Ho detto che non ne parlo.»
      ettore:
        name: Ettore
        article: none
        gender: m
        aliases: [maggiordomo]
        text: «Ettore è vecchio, e crede ancora alle favole.»
        again: «Chiedete a lui le sue favole.»
      corrado:
        name: Corrado
        article: none
        gender: m
        aliases: [nipote]
        text: >
          «Il nipote del conte.» Livia stringe le labbra. «Aspetta il notaio come un avvoltoio aspetta
          il temporale. Non parlo male dei padroni, signorina: ma lui, padrone, non lo è ancora.»
        again: «Ho già detto troppo, su di lui.»
      agnese:
        name: Agnese
        article: none
        gender: f
        aliases: [dama di compagnia, ragazza]
        text: >
          «Troppo gentile, per i miei gusti. Sempre attorno alla contessa, con le sue gocce e i suoi
          romanzi. E sempre in giro per la casa a ore strane.»
        again: "«Ve l'ho detto: troppo gentile.»"
      ferri:
        name: dottor Ferri
        article: definite
        gender: m
        aliases: [dottore, medico, ferri]
        text: «Il dottore firma quello che gli dicono di firmare, purché il bicchiere sia pieno.»
        again: «Chiedete a lui, se lo trovate sobrio.»
      notaio:
        name: notaio
        gender: m
        aliases: [frana, strada]
        text: «Il notaio doveva venire il 20. Con la frana, chissà quando.»
        again: «Il 20, vi ho detto. Se la strada lo permette.»
      chiavi:
        name: chiavi
        gender: f
        plural: true
        aliases: [mazzo di chiavi, quadro delle chiavi]
        text: «Ogni chiave di questa casa passa da me.»
        again: «Tutte da me. Non fatemelo ripetere.»

  corrado:
    name: Corrado
    article: none
    gender: m
    aliases: [nipote, signor corrado]
    description: >
      Un uomo sui quarant'anni, elegante ma trasandato, con la cravatta allentata e un bicchiere
      vuoto in mano. Ha l'aria di chi aspetta un treno in ritardo.
    location: biliardo
    greeting: >
      «Un'altra parente sconosciuta?» Corrado ride senza allegria. «Mettetevi in fila. Quando
      arriverà il notaio vedrete che qui non c'è niente per nessuno, tranne che per me.»
    greeting_again: «Ancora qui?» Corrado alza il bicchiere vuoto, come per un brindisi. «Allora mettetevi comoda.»
    unknown: Corrado scrolla le spalle. «Chiedetelo a Ettore, lui sa tutto.»
    refuses: «Non accetto regali dagli estranei.»
    gestures:
      congedo:
        text: «Andate, andate. Tanto dove volete andare, con la frana?»
      grazie:
        text: "«Non ringraziatemi: non ho fatto niente, e non ho intenzione di cominciare.»"
        again: «Ancora? Siete una persona molto riconoscente.»
      scuse:
        text: Corrado fa un gesto annoiato. «Non ci ho nemmeno fatto caso.»
      come_stai:
        text: >
          «Come uno che aspetta un'eredità da una settimana. Benissimo, quindi. Grazie per
          l'interesse.»
      chi_sei:
        text: >
          «Corrado di Valdimora, nipote del conte buonanima. E, salvo sorprese, il prossimo padrone
          di tutto questo.»
      scortesia:
        text: Corrado ride. «Finalmente qualcuno sincero, in questa casa.»
    topics:
      eredita:
        name: eredità
        gender: f
        aliases: [notaio, testamento, castello, soldi]
        text: >
          «Il castello, le terre, tutto quanto. Il conte non aveva altri eredi che me, e mia zia,
          pace all'anima sua, si è solo presa il suo tempo. Chiedete a Livia, se non mi credete: il
          notaio lo aspetta lei.»
        again: «Tutto a me, ve l'ho detto. Mettetevi il cuore in pace.»
      contessa:
        name: contessa
        gender: f
        aliases: [zia, adelaide, morte]
        text: >
          «Il cuore. Ferri l'ha detto subito, e meno se ne parla meglio è: i giornali della città
          non aspettano altro.»
        again: «Il cuore, ho detto. Meno se ne parla, meglio è.»
      ferri:
        name: dottor Ferri
        article: definite
        gender: m
        aliases: [dottore, medico, ferri]
        text: «Il nostro dottore beve più di quanto curi. Ma sa quando tacere.»
        again: «Sa quando tacere, ve l'ho detto. Imparate da lui.»
      livia:
        name: Livia
        article: none
        gender: f
        aliases: [governante]
        text: >
          «Livia? Tiene le chiavi di tutto, e la bocca chiusa su tutto. Quando sarò io il padrone,
          vedremo quanto dura.»
        again: «Le chiavi e la bocca chiusa, ve l'ho detto.»
      ettore:
        name: Ettore
        article: none
        gender: m
        aliases: [maggiordomo, vecchio]
        text: «Il vecchio Ettore. Piange la zia più di tutti noi messi insieme. Sentimentale.»
        again: "«Chiedete a lui: piangerà anche con voi.»"
      agnese:
        name: Agnese
        article: none
        gender: f
        aliases: [dama di compagnia, ragazza]
        text: >
          «Agnese?» Corrado allunga la mano verso la bottiglia, ma è vuota. «Una brava ragazza.
          Faceva compagnia a mia zia, tutto qui. Perché me lo chiedete? Parliamo d'altro.»
        again: «Vi ho detto di parlare d'altro.»
      frana:
        name: frana
        gender: f
        aliases: [strada]
        text: «Una settimana, dicono, per liberare la strada. Una settimana chiuso qui con voi tutti.»
        again: «Una settimana. Contate i giorni con me, se vi diverte.»

  ferri:
    name: dottor Ferri
    article: definite
    gender: m
    aliases: [dottore, medico, ferri]
    description: >
      Un uomo grasso e rubicondo, col panciotto slacciato. Accanto a lui, sul tavolino, la sua borsa
      da medico.
    variants:
      - when: {flag: ferri_addormentato}
        text: >
          Il dottor Ferri dorme sprofondato in poltrona, con la bocca aperta. La sua borsa è sul
          tavolino.
    location: biliardo
    greeting: >
      «Signorina.» Il dottore solleva il bicchiere vuoto e lo guarda con tristezza. «In questa casa
      si muore, e non si beve nemmeno più.»
    greeting_variants:
      - when: {flag: ferri_addormentato}
        text: Il dottor Ferri russa. Non c'è verso di svegliarlo.
    greeting_again: «Ancora voi, signorina?» Il dottore ti sorride con gli occhi lucidi.
    unknown: Dal dottore, su questo, non cavi niente.
    refuses: Il dottore non ne vuole sapere.
    gestures:
      congedo:
        text: «Andate, andate. Io resto qui, col mio bicchiere vuoto.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
      grazie:
        text: «Di niente, signorina, di niente.»
        again: «Mi ringraziate troppo. Non ci sono abituato.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
      scuse:
        text: «Ma figuratevi.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
      come_stai:
        text: >
          «Come un medico in una casa dove qualcuno è appena morto: fuori posto.» Guarda il
          bicchiere. «E a secco.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa beato.
      chi_sei:
        text: >
          «Anselmo Ferri, medico condotto. Curo questa famiglia da vent'anni, e ancora non l'ho
          guarita.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
      scortesia:
        text: «Ho sentito di peggio dai miei pazienti, e ne ho seppelliti parecchi.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa, e non ti sente.
    topics:
      contessa:
        name: contessa
        gender: f
        aliases: [morte, adelaide, certificato, cuore]
        text: >
          «Arresto cardiaco. Il cuore era stanco, lo sapevamo tutti. Ho firmato il certificato la
          mattina stessa.» Beve un sorso dal bicchiere vuoto. «Corrado insisteva per non chiamare
          nessuno da fuori.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
        again: «Arresto cardiaco, vi ho detto. Non c'è altro da dire.»
      grappa:
        name: grappa
        gender: f
        aliases: [bottiglia, bere, liquore]
        text: >
          «Questa è vuota. La grappa buona Ettore la tiene sotto chiave, nella credenza della sala da
          pranzo. Come un tesoro.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
          - when: {has: grappa}
            text: «Quella è grappa? Signorina, non fatemi soffrire.»
        again: «La credenza della sala da pranzo, signorina. Ve l'ho detto.»
      medicine:
        name: medicine
        gender: f
        plural: true
        aliases: [farmaco, gocce, digitale, borsa]
        text: >
          «Digitale, gocce per il cuore. Io le prescrivevo, e la ragazza, Agnese, gliele dava ogni
          sera.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
        again: «Digitale, vi ho detto. Io la prescrivevo, lei la dava.»
      corrado:
        name: Corrado
        article: none
        gender: m
        aliases: [nipote]
        text: >
          «Corrado è un giovane… generoso. Con gli amici, intendo.» Il dottore tossisce. «Mi ha dato
          una mano, in passato. Non parliamo di soldi, vi prego.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
        again: «Non parliamo di soldi, vi ho detto.»
      agnese:
        name: Agnese
        article: none
        gender: f
        aliases: [dama di compagnia, ragazza]
        text: >
          «Agnese? Bravissima. Precisa con le gocce come un farmacista: io scrivevo la dose, lei la
          dava, e annotava tutto.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
        again: «Una ragazza precisa, ve l'ho detto.»

  agnese:
    name: Agnese
    article: none
    gender: f
    aliases: [dama di compagnia, ragazza]
    description: >
      Una ragazza di trent'anni, pallida, vestita di nero. Ha gli occhi gonfi e un rosario tra le
      dita.
    location: cappella
    greeting: >
      Agnese si alza di scatto, poi ti sorride tra le lacrime. «Voi dovete essere la signorina di
      Genova. La contessa parlava di una visita… Se vi serve qualcosa, qualunque cosa, chiedete a
      me.»
    greeting_again: «Eccovi di nuovo.» Agnese ti sorride. «Avete bisogno di me?»
    unknown: «Non saprei, signorina. Chiedete a Ettore, forse.»
    refuses: «Oh, no, non potrei.»
    gestures:
      congedo:
        text: «Andate pure. Io resto con lei.» Agnese torna a guardare la bara.
      grazie:
        text: "«Di niente. Chiedete pure: sono qui per aiutarvi.»"
        again: «Per così poco!»
      scuse:
        text: «Oh, non c'è niente da perdonare.»
      come_stai:
        text: >
          «Stanca. Non dormo da tre notti.» Si stringe il rosario tra le dita. «Ma voi, piuttosto:
          avete trovato quello che cercavate?»
      chi_sei:
        text: >
          «Agnese. Ero la dama di compagnia della contessa: le leggevo i romanzi, le davo le medicine,
          le tenevo compagnia la notte.»
      scortesia:
        text: Agnese abbassa gli occhi. «Scusatemi. Forse vi ho disturbata.»
    topics:
      contessa:
        name: contessa
        gender: f
        aliases: [adelaide, padrona, morte]
        text: >
          «Era così buona con me. La sera le leggevo i romanzi, e le davo le sue gocce.» Si asciuga
          gli occhi. «Quella notte dormiva così tranquilla…»
        again: «Scusatemi, non riesco a parlarne senza piangere.»
      medicine:
        name: medicine
        gender: f
        plural: true
        aliases: [gocce, digitale, farmaco]
        text: «Le gocce per il cuore. Le contavo io, una per una, come diceva il dottore.»
        again: «Una per una, come diceva il dottore.»
      corrado:
        name: Corrado
        article: none
        gender: m
        aliases: [nipote, signor corrado]
        text: >
          «Il signor Corrado?» Agnese arrossisce appena. «È un uomo buono, sapete, anche se non
          sembra. Tutti lo giudicano male, ma lui… lui ha tante preoccupazioni.» Si interrompe.
          «Scusate, non sono cose mie.»
        again: «Non giudicatelo male, vi prego.»
      ettore:
        name: Ettore
        article: none
        gender: m
        aliases: [maggiordomo]
        text: >
          «Ettore è stato gentile con me fin dal primo giorno. Vi ha detto qualcosa, di voi? Della
          contessa?» Agnese ti guarda un momento di troppo.
        again: «Ettore sa tante cose, sapete.»
      livia:
        name: Livia
        article: none
        gender: f
        aliases: [governante]
        text: «La signora Livia non mi ha mai sopportata.» Agnese sospira. «Ma io non le porto rancore.»
        again: «Non le porto rancore, davvero.»
      aiuto:
        name: aiuto
        gender: m
        aliases: [aiutare, serve]
        text: «Qualunque cosa. La contessa avrebbe voluto così.»
        again: «Qualunque cosa, ve l'ho detto.»
