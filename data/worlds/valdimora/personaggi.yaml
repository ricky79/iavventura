# I personaggi di Valdimora. Dove stanno atto per atto: spec, sezione 2 (tabella dei personaggi), e
# le decisioni di ogni atto (Ferri resta nel biliardo). Gli atti restano veri dopo il loro inizio,
# quindi le varianti di un atto vengono prima di quelle degli atti precedenti.
# I domestici danno del voi a Irene («signorina»); la narrazione le dà del tu. Gesti e opinioni
# reciproche: docs/superpowers/specs/2026-09-29-dialoghi-design.md. Nessuno rivela i segreti degli
# atti successivi; Agnese e Corrado, però, si difendono a vicenda.

characters:
  ettore:
    name: Ettore
    article: none
    gender: m
    aliases: [maggiordomo, vecchio]
    description: >
      Un uomo alto e magro, sui settant'anni, in livrea nera. Ha gli occhi rossi di chi non dorme da
      giorni.
    location: stanza_maggiordomo
    moves:
      - when: {flag: atto_tre}
        room: cucina
      - when: {flag: atto_due}
        room: galleria
    greeting: >
      Ettore si alza a fatica dalla sedia. «Perdonate, signorina: la casa è in lutto. La contessa ci
      ha lasciati tre giorni fa. Chi siete, e chi vi manda?»
    greeting_variants:
      - when: {flag: lettere_lette}
        text: >
          Ettore posa l'argenteria e ti guarda a lungo. «Avete letto le sue lettere. Ve lo leggo in
          faccia.» Gli tremano le labbra. «Bentornata a casa, signorina.»
        again: «Signorina.» Ettore ti sorride, e torna alla sua argenteria.
      - when: {flag: atto_tre}
        text: >
          Ettore è in cucina, accanto al focolare, e lucida l'argenteria per tenere occupate le mani.
          «Signorina. Siete salita fin lassù, allora.»
        again: «Signorina.» Ettore non alza gli occhi dall'argenteria.
      - when: {flag: ritratto_scoperto}
        text: Ettore guarda il ritratto, poi guarda te. «Ora avete visto», dice soltanto.
        again: Ettore resta accanto al ritratto, in silenzio. «Chiedete, signorina.»
      - when: {flag: atto_due}
        text: >
          Ettore è in piedi davanti al quadro coperto, le mani dietro la schiena. «Signorina. Sapevo
          che prima o poi sareste venuta qui.»
        again: «Signorina.» Ettore non si è mosso dal quadro coperto.
      - when: {flag: busta_data}
        text: «Signorina Irene.» Ettore si inchina appena. «Chiedete pure. Quello che so, è vostro.»
        again: «Ditemi, signorina Irene.»
    greeting_again: «Ancora voi, signorina? Non mi avete detto chi vi manda.»
    unknown: Ettore scuote la testa. «Su questo non so dirvi niente, signorina.»
    refuses: «No, signorina, non posso accettare.»
    gestures:
      congedo:
        text: «Andate pure, signorina. Io sono qui, se vi servo.»
      grazie:
        text: Ettore china il capo. «Non c'è di che, signorina.»
        again: «Basta così, signorina. È il mio dovere.»
      scuse:
        text: «Non avete niente da farvi perdonare, signorina.»
      come_stai:
        text: >
          «Come un vecchio che ha perso la sua padrona.» Ettore si passa una mano sugli occhi. «Ma si
          va avanti.»
        variants:
          - when: {flag: busta_data}
            text: «Meglio, da quando siete arrivata.» Per un attimo, Ettore quasi sorride.
      chi_sei:
        text: >
          «Ettore, il maggiordomo. Servo in questa casa da cinquant'anni: ho visto nascere più cose di
          quante ne ricordi.»
      scortesia:
        text: >
          Ettore si irrigidisce, ma non alza la voce. «Siete stanca e bagnata, signorina. Facciamo
          finta che non l'abbiate detto.»
    topics:
      contessa:
        name: contessa
        gender: f
        aliases: [adelaide, padrona, morte]
        text: >
          «Il cuore, dicono. Da mesi non stava bene, ma quella notte…» Ettore tace, e guarda altrove.
          «Il dottore l'ha trovata all'alba.»
        again: «Non chiedetemi di parlarne ancora, signorina. Non stanotte.»
      lettera:
        name: lettera
        gender: f
        aliases: [invito, lettera della contessa]
        text: «La contessa vi ha scritto?» Ettore tende la mano. «Posso vederla?»
        variants:
          - when: {flag: busta_data}
            text: «L'ha scritta con le ultime forze, ne sono sicuro.»
        again: "«La lettera, signorina: fatemela vedere.»"
      credenza:
        name: credenza
        gender: f
        aliases: [grappa, liquori, chiave della credenza]
        when: {flag: busta_data}
        effects:
          - give: chiave_credenza
        text: >
          «La grappa buona è nella credenza della sala da pranzo.» Ettore ti mette in mano una
          chiavina legata a un nastro. «Ecco la chiave. Ma non ditelo alla signora Livia.»
        variants:
          - when: {flag: credenza_aperta}
            text: «Avete trovato la grappa? Acqua in bocca con Livia, mi raccomando.»
        again: «La chiave ve l'ho data, signorina. Il resto è affare vostro.»
      clara:
        name: Clara
        article: none
        gender: f
        aliases: [madre, mamma, mia madre, tua madre]
        when: {flag: busta_data}
        text: >
          Ettore distoglie lo sguardo. «Non qui, signorina. Non ancora. La contessa ha voluto che le
          cose le trovaste da voi.»
        variants:
          - when: {flag: lettere_lette}
            text: >
              «Ora sapete. Era vostra nonna, signorina, e vi voleva qui.» Ettore abbassa gli occhi.
              «Perdonatemi se non ve l'ho detto io: le avevo dato la mia parola.»
          - when: {flag: ritratto_scoperto}
            text: >
              «L'avete vista, ora. Aveva il vostro stesso modo di guardare le cose.» Ettore si passa
              una mano sugli occhi. «Non chiedetemi altro, signorina. Non ancora.»
        again: «Abbiate pazienza, signorina. Ogni cosa a suo tempo.»
      ritratto:
        name: ritratto
        gender: m
        aliases: [quadro, quadro coperto, drappo, galleria, ragazza]
        when: {flag: atto_due}
        text: >
          «Quel quadro è coperto dal 1897. Ordini del conte: nessuno doveva più vederlo.» Ettore
          guarda il drappo nero. «Il conte è morto da dodici anni, signorina, e io sono vecchio. Se
          volete guardare, non sarò io a fermarvi.»
        variants:
          - when: {flag: ritratto_scoperto}
            text: >
              «La signorina Clara, a vent'anni. Viveva qui, in questa casa.» Ettore si schiarisce la
              voce. «Il resto la contessa ha voluto che lo scopriste da voi, e io le ho dato la mia
              parola.»
        again: «Il drappo, signorina. Nessuno vi fermerà.»
      carillon:
        name: carillon
        gender: m
        aliases: [cilindro, ninna nanna, musica, salone della musica]
        when: {flag: ritratto_scoperto}
        text: >
          «Il carillon d'argento, nel salone della musica? Era della signorina Clara. Da bambina non
          si addormentava senza la sua ninna nanna.»
        variants:
          - when: {flag: carillon_suonato}
            text: >
              «L'avete fatto suonare. L'ho sentito fin qui.» Ettore chiude gli occhi. «La ninna nanna
              della signorina Clara. Non la sentivo da trent'anni.»
        again: «Nel salone della musica, signorina.»
      livia:
        name: Livia
        article: none
        gender: f
        aliases: [governante, chiavi]
        effects:
          - set_flag: ettore_garantisce
        text: >
          «Livia? Tiene le chiavi di tutto, ed è dura. Ma è onesta.» Ettore annuisce, deciso. «Se vi
          serve qualcosa da lei, una parola gliela metto io: saprà che siete chi dite di essere.»
        variants:
          - when: {flag: livia_chiave}
            text: «Visto? Livia è dura, ma è giusta.»
        again: «Le ho già parlato, signorina. State tranquilla.»
      corrado:
        name: Corrado
        article: none
        gender: m
        aliases: [nipote]
        text: >
          «Il nipote del conte. Si considera già il padrone.» Ettore abbassa la voce. «Non fidatevi
          troppo, signorina.»
        again: «Non fidatevi troppo di lui, ve l'ho detto.»
      agnese:
        name: Agnese
        article: none
        gender: f
        aliases: [dama di compagnia]
        text: >
          «La dama di compagnia della contessa. Le leggeva i romanzi, le dava le medicine. Da quando
          è morta non si stacca da lei, in cappella.»
        variants:
          - when: {flag: agnese_in_cucina}
            text: «È qui con noi, signorina, davanti al focolare. Dice che vi prepara una tisana.»
          - when: {flag: agnese_in_rimessa}
            text: «È scesa in rimessa, a prendervi il petrolio. Una ragazza servizievole.»
          - when: {flag: atto_tre}
            text: >
              «La dama di compagnia della contessa. Ora sta di sopra, nel corridoio della servitù, e
              si offre di fare commissioni a tutti. Una ragazza servizievole.»
          - when: {flag: atto_due}
            text: >
              «La dama di compagnia della contessa. Le leggeva i romanzi, le dava le medicine. Ora sta
              nella loggia, in cima allo scalone: dice che vi aspetta, se avete bisogno.»
        again: «Povera ragazza. È sempre in cappella, con la contessa.»
      ferri:
        name: dottor Ferri
        article: definite
        gender: m
        aliases: [dottore, medico, ferri]
        text: «Il dottor Ferri? Un buon medico, una volta. Ora beve più di quanto visiti.»
        again: "«Ve l'ho detto: una volta era un buon medico.»"
      frana:
        name: frana
        gender: f
        aliases: [strada, notaio]
        text: >
          «Finché non liberano la strada, qui non arriva nessuno. Nemmeno il notaio, che Livia
          aspettava per il 20.»
        again: «Ci vorranno giorni, signorina. Siamo tutti chiusi qui.»
      lanterna:
        name: lanterna
        gender: f
        aliases: [lume, petrolio, fiammiferi]
        when: {flag: atto_tre}
        text: >
          «Una lanterna? Ce n'è una vecchia in soffitta, nel sottotetto, se il pavimento regge
          ancora. Il petrolio lo trovate in rimessa, e i fiammiferi qui in cucina.»
        variants:
          - when: {flag: lanterna_accesa}
            text: «Bene. Con quella, laggiù, ci vedrete.»
          - when: {flag: lanterna_piena}
            text: "«Piena di petrolio, vedo. I fiammiferi sono qui in cucina: accendetela pure.»"
          - when: {has: lanterna}
            text: >
              «L'avete trovata, allora. Ora le serve il petrolio: c'è una tanica in rimessa. E i
              fiammiferi sono qui in cucina.»
        again: «Il petrolio in rimessa, signorina, i fiammiferi qui in cucina.»
      cantina:
        name: cantina
        gender: f
        aliases: [porta della cantina, chiave della cantina, vino]
        when: {flag: atto_tre}
        text: >
          «La cantina è chiusa da quest'estate. La chiave la teneva la contessa, e non so dove l'abbia
          messa. Laggiù è buio pesto, signorina: senza un lume non si scende.»
        variants:
          - when: {has: chiave_cantina}
            text: >
              «Quella è la chiave della cantina.» Ettore la guarda, poi guarda te. «Laggiù è buio, e
              si scende più facilmente di quanto si risalga. Siete sicura di avere tutto, signorina?»
        again: «Senza un lume, laggiù, non si scende.»

  livia:
    name: Livia
    article: none
    gender: f
    aliases: [governante, signora livia]
    description: >
      Una donna sulla cinquantina, vestita di grigio, con un mazzo di chiavi alla cintura. Ti guarda
      come si guarda una macchia sul tappeto.
    variants:
      - when: {flag: atto_tre}
        text: >
          Una donna sulla cinquantina, vestita di grigio. Senza il mazzo di chiavi alla cintura sembra
          più piccola, e più vecchia.
    location: ufficio_governante
    moves:
      - when: {flag: atto_tre}
        room: camera_livia
      - when: {flag: atto_due}
        room: camera_contessa
    greeting: >
      «Siete voi, quella della corriera.» Livia non si alza. «La casa è in lutto, signorina. Non so
      che cosa siate venuta a cercare, ma qui non troverete niente.»
    greeting_variants:
      - when: {flag: livia_confessa}
        text: >
          Livia è seduta sul letto, con le mani in grembo e gli occhi rossi. «Vi ho detto tutto,
          signorina. Ora lasciatemi sola.»
      - when: {flag: atto_tre}
        text: >
          Livia è seduta sul letto della sua camera, le mani in grembo. Senza il mazzo di chiavi alla
          cintura sembra più piccola. «Anche qui, signorina? In camera mia non c'è niente per voi.»
        again: «Ancora voi.» Livia non si alza dal letto.
      - when: {flag: livia_permette}
        text: Livia è seduta accanto al letto, e guarda la rosa sul comodino. «Grazie», dice soltanto.
        again: Livia guarda ancora la rosa sul comodino. Non dice niente, ma non ti manda via.
      - when: {flag: atto_due}
        text: >
          Livia è seduta rigida su una sedia accanto al letto vuoto. «Siete salita, allora. Questa era
          la sua camera, signorina: non toccate niente.»
        again: «Ancora voi.» Livia non si alza dalla sedia accanto al letto. «Non toccate niente.»
      - when: {flag: livia_chiave}
        text: «Avete la chiave. Non toccate le cose della contessa.»
        again: «Ancora voi.» Livia non alza nemmeno gli occhi dai conti.
    greeting_again: «Ancora voi.» Livia non alza nemmeno gli occhi dai conti.
    unknown: «Non sono cose che vi riguardano.»
    refuses: «Tenete le vostre cose, signorina.»
    gestures:
      congedo:
        text: «Andate pure. E non toccate niente.»
      grazie:
        text: «Non ringraziatemi. Faccio il mio dovere.»
        again: «Basta ringraziare, signorina. Non serve.»
      scuse:
        text: «Le scuse non riaprono le porte, signorina.»
      come_stai:
        text: >
          «Come si sta, in una casa senza padrona.» Livia rimette in fila una penna che era già in
          fila.
        variants:
          - when: {flag: livia_chiave}
            text: «Ho dato la chiave dello scalone a una sconosciuta. Come volete che stia?»
      chi_sei:
        text: «Livia, la governante. Da trent'anni tengo in piedi questa casa.»
      scortesia:
        text: Livia ti guarda senza battere ciglio. «Ne ho sentite di peggio, e da gente migliore.»
    topics:
      scalone:
        name: scalone
        gender: m
        aliases: [piano nobile, piano di sopra, chiave dello scalone, porta]
        text: «Il piano nobile resta chiuso finché non arriva il notaio. Ordini miei.»
        variants:
          - when: {flag: atto_due}
            text: «Ormai siete salita. Non fatemene pentire.»
          - when: {flag: livia_chiave}
            text: «Avete la chiave. Non fatemene pentire.»
        again: "«Ve l'ho già detto: finché non arriva il notaio, resta chiuso.»"
      contessa:
        name: contessa
        gender: f
        aliases: [adelaide, padrona, morte]
        text: >
          «Trent'anni al suo servizio.» Per un attimo la voce le si incrina. «Non parlo della
          contessa con gli estranei.»
        again: «Ho detto che non ne parlo.»
      ettore:
        name: Ettore
        article: none
        gender: m
        aliases: [maggiordomo]
        text: «Ettore è vecchio, e crede ancora alle favole.»
        again: «Chiedete a lui le sue favole.»
      corrado:
        name: Corrado
        article: none
        gender: m
        aliases: [nipote]
        text: >
          «Il nipote del conte.» Livia stringe le labbra. «Aspetta il notaio come un avvoltoio aspetta
          il temporale. Non parlo male dei padroni, signorina: ma lui, padrone, non lo è ancora.»
        again: «Ho già detto troppo, su di lui.»
      agnese:
        name: Agnese
        article: none
        gender: f
        aliases: [dama di compagnia, ragazza]
        text: >
          «Troppo gentile, per i miei gusti. Sempre attorno alla contessa, con le sue gocce e i suoi
          romanzi. E sempre in giro per la casa a ore strane.»
        again: "«Ve l'ho detto: troppo gentile.»"
      ferri:
        name: dottor Ferri
        article: definite
        gender: m
        aliases: [dottore, medico, ferri]
        text: «Il dottore firma quello che gli dicono di firmare, purché il bicchiere sia pieno.»
        again: «Chiedete a lui, se lo trovate sobrio.»
      notaio:
        name: notaio
        gender: m
        aliases: [frana, strada]
        text: «Il notaio doveva venire il 20. Con la frana, chissà quando.»
        again: «Il 20, vi ho detto. Se la strada lo permette.»
      chiavi:
        name: chiavi
        gender: f
        plural: true
        aliases: [mazzo di chiavi, quadro delle chiavi]
        text: «Ogni chiave di questa casa passa da me.»
        again: «Tutte da me. Non fatemelo ripetere.»
      rose:
        name: rosa bianca
        gender: f
        aliases: [rosa, rose, rose bianche, vasetto, comodino]
        when: {flag: atto_due}
        text: >
          «Ogni mattina, per trent'anni, le ho portato una rosa bianca della serra, per il comodino.
          Le piacevano solo quelle.» Livia guarda il vasetto vuoto. «Da quando è morta non ho avuto
          il coraggio di coglierne una.»
        variants:
          - when: {flag: livia_permette}
            text: «È bella, la vostra rosa. Lei l'avrebbe tenuta fino all'ultimo petalo.»
        again: «Una rosa bianca, ogni mattina. Dalla serra.»
      boudoir:
        name: boudoir
        gender: m
        aliases: [porta del boudoir, porta bassa, portagioie]
        when: {flag: atto_due}
        text: >
          «Il boudoir era suo e basta. Nessuno ci entrava, nemmeno io, se non chiamata.» Livia stringe
          le labbra. «Non lo apro al primo che capita.»
        variants:
          - when: {flag: livia_permette}
            text: «Andate pure. Ve l'ho detto.»
        again: «Lì dentro no, signorina.»
      campanello:
        name: campanello
        gender: m
        aliases: [cordone, cordone del campanello, filo, campanelli]
        when: {flag: atto_due}
        text: >
          «Tagliato?» Livia si alza e guarda il cordone, e per la prima volta la vedi turbata. «Non me
          n'ero accorta. La notte la contessa non chiamava mai: c'era Agnese, con le sue gocce.»
        again: «Non so chi l'abbia tagliato, signorina. Non lo so.»
      scala_servizio:
        name: scala di servizio
        gender: f
        aliases: [porta di servizio, porta della scala di servizio, chiave della scala di servizio, soffitta]
        when: {flag: atto_due}
        text: «La chiave della scala di servizio la teneva la contessa, non io. Chissà dove l'ha messa.»
        variants:
          - when: {flag: atto_tre}
            text: «Siete salita anche quassù. Non vi ferma niente, eh, signorina?»
          - when: {has: chiave_servizio}
            text: >
              Livia guarda la chiave che hai in mano, col suo nastro azzurro. «Allora l'avete trovata
              voi.» Stringe le labbra. «Fate quello che dovete, signorina.»
        again: "«Ve l'ho detto: la teneva lei.»"
      fotografia:
        name: fotografia
        gender: f
        aliases: [foto, fotografia di mia madre]
        when: {all: [{flag: atto_tre}, {has: fotografia}]}
        text: «Che cosa tenete in mano?» Livia tende la mano, e la mano trema. «Datemela. Fatemela vedere da vicino.»
        variants:
          - when: {flag: livia_confessa}
            text: «Avete i suoi occhi. Avrei dovuto capirlo il primo giorno.»
        again: «Datemela, vi ho detto.»
      clara:
        name: Clara
        article: none
        gender: f
        aliases: [madre, mamma, mia madre]
        when: {flag: atto_tre}
        text: «Non conosco nessuna Clara.» Ma le mani, in grembo, le tremano.
        variants:
          - when: {flag: livia_confessa}
            text: «Era la ragazza più buona di questa casa. E io l'ho tradita.»
        again: «Vi ho detto che non la conosco.»
      camera_clara:
        name: camera di Clara
        gender: f
        aliases: [camera chiusa, porta in fondo, targhetta, chiave della camera di Clara]
        when: {flag: atto_tre}
        text: «Quella porta è chiusa dal 1897, signorina. Non si apre. Non per voi.»
        variants:
          - when: {flag: camera_clara_aperta}
            text: «L'avete aperta, allora. Trent'anni…» Livia si fa il segno della croce.
          - when: {flag: livia_confessa}
            text: «La chiave ce l'avete. Andate.»
        again: «Non si apre, vi ho detto.»

  corrado:
    name: Corrado
    article: none
    gender: m
    aliases: [nipote, signor corrado]
    description: >
      Un uomo sui quarant'anni, elegante ma trasandato, con la cravatta allentata e un bicchiere
      vuoto in mano. Ha l'aria di chi aspetta un treno in ritardo.
    location: biliardo
    moves:
      - when: {flag: atto_tre}
        room: archivio
      - when: {flag: atto_due}
        room: studio_conte
    greeting: >
      «Un'altra parente sconosciuta?» Corrado ride senza allegria. «Mettetevi in fila. Quando
      arriverà il notaio vedrete che qui non c'è niente per nessuno, tranne che per me.»
    greeting_variants:
      - when: {flag: lettere_lette}
        text: >
          Corrado ti aspetta sulla soglia dell'archivio, con un foglio ingiallito in mano. «Clara di
          Valdimora, nata nel 1878», legge ad alta voce. «La figlia di cui nessuno parlava.» Ti guarda
          il medaglione, poi la faccia, e non ride più. «Allora siete voi. La nipotina. Godetevela
          finché dura: il notaio non è ancora arrivato, e la strada è lunga.»
        again: «Ancora qui, nipotina? Godetevela, finché dura.»
      - when: {flag: atto_tre}
        text: >
          Corrado è chino su un faldone aperto, in una nuvola di polvere e di fumo. «Le carte di
          famiglia», dice senza alzare gli occhi. «Voglio essere sicuro che il notaio non trovi
          sorprese.»
        again: «Ancora voi? Sto lavorando, signorina.»
      - when: {flag: atto_due}
        text: >
          Corrado è seduto alla scrivania del conte, coi piedi sul piano di mogano. «Guarda chi si
          vede. Siete arrivata fin quassù? Prendete pure quello che volete, signorina: tanto, tra
          poco, qui sarà tutto mio.»
        again: «Ancora voi?» Corrado non toglie i piedi dalla scrivania. «Servitevi, signorina, servitevi.»
    greeting_again: «Ancora qui?» Corrado alza il bicchiere vuoto, come per un brindisi. «Allora mettetevi comoda.»
    unknown: Corrado scrolla le spalle. «Chiedetelo a Ettore, lui sa tutto.»
    refuses: «Non accetto regali dagli estranei.»
    gestures:
      congedo:
        text: «Andate, andate. Tanto dove volete andare, con la frana?»
      grazie:
        text: "«Non ringraziatemi: non ho fatto niente, e non ho intenzione di cominciare.»"
        again: «Ancora? Siete una persona molto riconoscente.»
      scuse:
        text: Corrado fa un gesto annoiato. «Non ci ho nemmeno fatto caso.»
      come_stai:
        text: >
          «Come uno che aspetta un'eredità da una settimana. Benissimo, quindi. Grazie per
          l'interesse.»
      chi_sei:
        text: >
          «Corrado di Valdimora, nipote del conte buonanima. E, salvo sorprese, il prossimo padrone
          di tutto questo.»
      scortesia:
        text: Corrado ride. «Finalmente qualcuno sincero, in questa casa.»
    topics:
      eredita:
        name: eredità
        gender: f
        aliases: [notaio, testamento, castello, soldi]
        text: >
          «Il castello, le terre, tutto quanto. Il conte non aveva altri eredi che me, e mia zia,
          pace all'anima sua, si è solo presa il suo tempo. Chiedete a Livia, se non mi credete: il
          notaio lo aspetta lei.»
        again: «Tutto a me, ve l'ho detto. Mettetevi il cuore in pace.»
      contessa:
        name: contessa
        gender: f
        aliases: [zia, adelaide, morte]
        text: >
          «Il cuore. Ferri l'ha detto subito, e meno se ne parla meglio è: i giornali della città
          non aspettano altro.»
        again: «Il cuore, ho detto. Meno se ne parla, meglio è.»
      ferri:
        name: dottor Ferri
        article: definite
        gender: m
        aliases: [dottore, medico, ferri]
        text: «Il nostro dottore beve più di quanto curi. Ma sa quando tacere.»
        again: «Sa quando tacere, ve l'ho detto. Imparate da lui.»
      livia:
        name: Livia
        article: none
        gender: f
        aliases: [governante]
        text: >
          «Livia? Tiene le chiavi di tutto, e la bocca chiusa su tutto. Quando sarò io il padrone,
          vedremo quanto dura.»
        again: «Le chiavi e la bocca chiusa, ve l'ho detto.»
      ettore:
        name: Ettore
        article: none
        gender: m
        aliases: [maggiordomo, vecchio]
        text: «Il vecchio Ettore. Piange la zia più di tutti noi messi insieme. Sentimentale.»
        again: "«Chiedete a lui: piangerà anche con voi.»"
      agnese:
        name: Agnese
        article: none
        gender: f
        aliases: [dama di compagnia, ragazza]
        text: >
          «Agnese?» Corrado allunga la mano verso la bottiglia, ma è vuota. «Una brava ragazza.
          Faceva compagnia a mia zia, tutto qui. Perché me lo chiedete? Parliamo d'altro.»
        again: «Vi ho detto di parlare d'altro.»
      frana:
        name: frana
        gender: f
        aliases: [strada]
        text: «Una settimana, dicono, per liberare la strada. Una settimana chiuso qui con voi tutti.»
        again: «Una settimana. Contate i giorni con me, se vi diverte.»
      bastone:
        name: bastone
        gender: m
        aliases: [bastone del conte, bastoni, rastrelliera, manico ricurvo]
        when: {flag: atto_due}
        text: «Il bastone di mio zio? Prendetelo pure, se vi fa comodo. Prendete quello che volete, ve l'ho detto.»
        variants:
          - when: {has: bastone}
            text: «L'avete già in mano, signorina. Tenetevelo pure, a me non serve.»
        again: «Prendetelo, vi ho detto.»
      studio:
        name: studio
        gender: m
        aliases: [studio del conte, scrivania, zio, ruggero]
        when: {flag: atto_due}
        text: >
          «Lo studio di mio zio Ruggero. È morto nel '15, e da allora qui dentro non ha comandato più
          nessuno.» Si accende una sigaretta. «Fino a me.»
        again: «Il mio studio, signorina. Quasi.»
      cambiali:
        name: cambiali
        gender: f
        plural: true
        aliases: [debiti, cambiale, gioco]
        when: {flag: atto_due}
        text: >
          «Siete stata in camera mia?» Per un attimo Corrado perde il sorriso. «Debiti di gioco. Il
          notaio li pagherà tutti, quando arriverà. Tutti.»
        again: «Il notaio li pagherà. Parliamo d'altro.»
      archivio:
        name: archivio
        gender: m
        aliases: [carte, faldone, faldoni, carte di famiglia, "1897"]
        when: {flag: atto_tre}
        text: >
          «Trecento anni di carte. Cerco quello che non c'è: un altro erede. E finora, niente.» Soffia
          via la polvere da un faldone.
        variants:
          - when: {flag: lettere_lette}
            text: «Ho trovato quello che cercavo. Purtroppo per voi, e per me.»
        again: «Sto cercando, signorina. Lasciatemi lavorare.»
      clara:
        name: Clara
        article: none
        gender: f
        aliases: [madre, mia madre]
        when: {flag: lettere_lette}
        text: >
          «Clara di Valdimora. Una zia che nessuno ha mai nominato, cancellata da tutto, tranne che da
          questo faldone.» Corrado lo chiude di colpo. «E da voi, a quanto pare.»
        again: «Non ne voglio parlare.»

  ferri:
    name: dottor Ferri
    article: definite
    gender: m
    aliases: [dottore, medico, ferri]
    description: >
      Un uomo grasso e rubicondo, col panciotto slacciato. Accanto a lui, sul tavolino, la sua borsa
      da medico.
    variants:
      - when: {flag: ferri_addormentato}
        text: >
          Il dottor Ferri dorme sprofondato in poltrona, con la bocca aperta. La sua borsa è sul
          tavolino.
    location: biliardo
    greeting: >
      «Signorina.» Il dottore solleva il bicchiere vuoto e lo guarda con tristezza. «In questa casa
      si muore, e non si beve nemmeno più.»
    greeting_variants:
      - when: {flag: ferri_addormentato}
        text: Il dottor Ferri russa. Non c'è verso di svegliarlo.
    greeting_again: «Ancora voi, signorina?» Il dottore ti sorride con gli occhi lucidi.
    unknown: Dal dottore, su questo, non cavi niente.
    refuses: Il dottore non ne vuole sapere.
    gestures:
      congedo:
        text: «Andate, andate. Io resto qui, col mio bicchiere vuoto.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
      grazie:
        text: «Di niente, signorina, di niente.»
        again: «Mi ringraziate troppo. Non ci sono abituato.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
      scuse:
        text: «Ma figuratevi.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
      come_stai:
        text: >
          «Come un medico in una casa dove qualcuno è appena morto: fuori posto.» Guarda il
          bicchiere. «E a secco.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa beato.
      chi_sei:
        text: >
          «Anselmo Ferri, medico condotto. Curo questa famiglia da vent'anni, e ancora non l'ho
          guarita.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
      scortesia:
        text: «Ho sentito di peggio dai miei pazienti, e ne ho seppelliti parecchi.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa, e non ti sente.
    topics:
      contessa:
        name: contessa
        gender: f
        aliases: [morte, adelaide, certificato, cuore]
        text: >
          «Arresto cardiaco. Il cuore era stanco, lo sapevamo tutti. Ho firmato il certificato la
          mattina stessa.» Beve un sorso dal bicchiere vuoto. «Corrado insisteva per non chiamare
          nessuno da fuori.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
        again: «Arresto cardiaco, vi ho detto. Non c'è altro da dire.»
      grappa:
        name: grappa
        gender: f
        aliases: [bottiglia, bere, liquore]
        text: >
          «Questa è vuota. La grappa buona Ettore la tiene sotto chiave, nella credenza della sala da
          pranzo. Come un tesoro.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
          - when: {has: grappa}
            text: «Quella è grappa? Signorina, non fatemi soffrire.»
        again: «La credenza della sala da pranzo, signorina. Ve l'ho detto.»
      medicine:
        name: medicine
        gender: f
        plural: true
        aliases: [farmaco, gocce, digitale, borsa, flacone, boccetta]
        text: >
          «Digitale, gocce per il cuore. Io le prescrivevo, e la ragazza, Agnese, gliele dava ogni
          sera.»
        variants:
          - when: {all: [{flag: ferri_addormentato}, {has: flacone}]}
            text: >
              Gli metti la boccetta sotto il naso. Il dottore apre un occhio, poi tutti e due, e il
              colore gli sparisce dalla faccia. «Questa è la digitale della contessa. Dove l'avete
              trovata?» La annusa, e la allontana con la mano che trema. «L'avevo portata piena, una
              settimana prima che morisse.» Poi la testa gli ricade sul petto, e ricomincia a russare.
            again: Il dottore russa. Stavolta, nemmeno la boccetta lo sveglia.
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
          - when: {has: flacone}
            text: >
              Il dottore vede la boccetta che hai in mano, e il colore gli sparisce dalla faccia.
              «Questa è la digitale della contessa. Dove l'avete trovata?» La annusa, e te la rende
              con la mano che trema. «L'avevo portata piena, una settimana prima che morisse.»
        again: «Digitale, vi ho detto. Io la prescrivevo, lei la dava.»
      corrado:
        name: Corrado
        article: none
        gender: m
        aliases: [nipote]
        text: >
          «Corrado è un giovane… generoso. Con gli amici, intendo.» Il dottore tossisce. «Mi ha dato
          una mano, in passato. Non parliamo di soldi, vi prego.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
        again: «Non parliamo di soldi, vi ho detto.»
      agnese:
        name: Agnese
        article: none
        gender: f
        aliases: [dama di compagnia, ragazza]
        text: >
          «Agnese? Bravissima. Precisa con le gocce come un farmacista: io scrivevo la dose, lei la
          dava, e annotava tutto.»
        variants:
          - when: {flag: ferri_addormentato}
            text: Il dottore russa.
        again: «Una ragazza precisa, ve l'ho detto.»

  agnese:
    name: Agnese
    article: none
    gender: f
    aliases: [dama di compagnia, ragazza]
    description: >
      Una ragazza di trent'anni, pallida, vestita di nero. Ha gli occhi gonfi e un rosario tra le
      dita.
    location: cappella
    moves:
      # Le commissioni del terzo atto: mandata di sotto, ci resta (spec, «Atto 3: decisioni»).
      - when: {flag: agnese_in_cucina}
        room: cucina
      - when: {flag: agnese_in_rimessa}
        room: rimessa
      - when: {flag: atto_tre}
        room: corridoio_servitu
      - when: {flag: atto_due}
        room: loggia
    greeting: >
      Agnese si alza di scatto, poi ti sorride tra le lacrime. «Voi dovete essere la signorina di
      Genova. La contessa parlava di una visita… Se vi serve qualcosa, qualunque cosa, chiedete a
      me.»
    greeting_variants:
      - when: {flag: agnese_in_cucina}
        text: >
          Agnese è in cucina, davanti al focolare, e versa l'acqua bollente in una tazza. «Eccovi,
          signorina. La tisana è quasi pronta.»
        again: «Vi aspetto qui, signorina, se vi serve altro.»
      - when: {all: [{flag: agnese_in_rimessa}, {has: tanica}]}
        text: «Avete la tanica? Bene.» Agnese si pulisce le mani nel grembiule. «Io resto qui ancora un po', signorina.»
      - when: {flag: agnese_in_rimessa}
        text: >
          Agnese è nella rimessa, accanto alla tanica del petrolio. «Eccola, signorina: prendetela
          pure, per me è troppo pesante.»
      - when: {flag: atto_tre}
        text: >
          Agnese è nel corridoio della servitù, davanti alla porta della sua camera, con la candela in
          mano. «Siete salita fin quassù? Qui dormiamo noi della servitù.» Ti sorride. «Se vi serve
          qualcosa di sotto, chiedete a me: scendo io.»
        again: «Eccovi. Se vi serve qualcosa di sotto, chiedete pure.»
      - when: {all: [{flag: atto_due}, {flag: medaglione_mostrato}]}
        text: «Signorina.» Agnese alza la candela e ti sorride. «Avete bisogno di me?»
      - when: {flag: atto_due}
        text: >
          Agnese ti aspetta in cima allo scalone, con una candela in mano. «Ce l'avete fatta! Livia vi
          ha dato la chiave?» Si avvicina, e i suoi occhi vanno al tuo collo. «Posso vedere il vostro
          medaglione? La contessa ne parlava tanto…»
        again: >
          «Eccovi di nuovo.» Agnese alza la candela, e i suoi occhi tornano al tuo collo. «Me lo fate
          vedere, il medaglione?»
    greeting_again: «Eccovi di nuovo.» Agnese ti sorride. «Avete bisogno di me?»
    unknown: «Non saprei, signorina. Chiedete a Ettore, forse.»
    refuses: «Oh, no, non potrei.»
    gestures:
      congedo:
        text: «Andate pure. Io resto con lei.» Agnese torna a guardare la bara.
        variants:
          - when: {flag: atto_due}
            text: «Andate pure. Io resto qui ad aspettarvi, se vi serve qualcosa.»
      grazie:
        text: "«Di niente. Chiedete pure: sono qui per aiutarvi.»"
        again: «Per così poco!»
      scuse:
        text: «Oh, non c'è niente da perdonare.»
      come_stai:
        text: >
          «Stanca. Non dormo da tre notti.» Si stringe il rosario tra le dita. «Ma voi, piuttosto:
          avete trovato quello che cercavate?»
      chi_sei:
        text: >
          «Agnese. Ero la dama di compagnia della contessa: le leggevo i romanzi, le davo le medicine,
          le tenevo compagnia la notte.»
      scortesia:
        text: Agnese abbassa gli occhi. «Scusatemi. Forse vi ho disturbata.»
    topics:
      contessa:
        name: contessa
        gender: f
        aliases: [adelaide, padrona, morte]
        text: >
          «Era così buona con me. La sera le leggevo i romanzi, e le davo le sue gocce.» Si asciuga
          gli occhi. «Quella notte dormiva così tranquilla…»
        again: «Scusatemi, non riesco a parlarne senza piangere.»
      medicine:
        name: medicine
        gender: f
        plural: true
        aliases: [gocce, digitale, farmaco]
        text: «Le gocce per il cuore. Le contavo io, una per una, come diceva il dottore.»
        again: «Una per una, come diceva il dottore.»
      corrado:
        name: Corrado
        article: none
        gender: m
        aliases: [nipote, signor corrado]
        text: >
          «Il signor Corrado?» Agnese arrossisce appena. «È un uomo buono, sapete, anche se non
          sembra. Tutti lo giudicano male, ma lui… lui ha tante preoccupazioni.» Si interrompe.
          «Scusate, non sono cose mie.»
        again: «Non giudicatelo male, vi prego.»
      ettore:
        name: Ettore
        article: none
        gender: m
        aliases: [maggiordomo]
        text: >
          «Ettore è stato gentile con me fin dal primo giorno. Vi ha detto qualcosa, di voi? Della
          contessa?» Agnese ti guarda un momento di troppo.
        again: «Ettore sa tante cose, sapete.»
      livia:
        name: Livia
        article: none
        gender: f
        aliases: [governante]
        text: «La signora Livia non mi ha mai sopportata.» Agnese sospira. «Ma io non le porto rancore.»
        again: «Non le porto rancore, davvero.»
      aiuto:
        name: aiuto
        gender: m
        aliases: [aiutare, serve]
        text: «Qualunque cosa. La contessa avrebbe voluto così.»
        variants:
          - when: {flag: atto_tre}
            text: >
              «Se vi serve qualcosa di sotto, chiedete a me: il petrolio per una lanterna, una tisana
              calda… Le scale le conosco a occhi chiusi.»
        again: «Qualunque cosa, ve l'ho detto.»
      petrolio:
        name: petrolio
        gender: m
        aliases: [tanica, tanica di petrolio]
        when: {all: [{flag: atto_tre}, {not: {has: tanica}}, {not: {flag: agnese_in_cucina}}]}
        effects:
          - set_flag: agnese_in_rimessa
        text: >
          «Il petrolio? Ce n'è una tanica in rimessa. Vado io, signorina: voi siete stanca. Vi aspetto
          laggiù.» E scende di corsa le scale.
        variants:
          - when: {player_in: rimessa}
            text: «La tanica è lì, signorina, accanto al muro. Prendetela pure, per me è troppo pesante.»
      tisana:
        name: tisana
        gender: f
        aliases: [camomilla, infuso, qualcosa di caldo, tazza]
        when: {flag: atto_tre}
        effects:
          - set_flag: agnese_in_cucina
        text: >
          «Una tisana? Ma certo, signorina: vado in cucina e ve la preparo. Vi aspetto là, al caldo.»
          Agnese prende la candela e scende.
        variants:
          - when: {player_in: cucina}
            text: >
              «Eccola, bella calda.» Agnese ti porge una tazza fumante, e tu la bevi a piccoli sorsi.
              Sa di camomilla e di miele. «Vi aspetto qui, se vi serve altro.»
      camera:
        name: camera
        gender: f
        aliases: [camera di Agnese, cameretta, porta della camera di Agnese]
        when: {flag: atto_tre}
        text: «La mia cameretta? È tutta in disordine, signorina. Non c'è niente da vedere.»
        again: «Niente da vedere, davvero.»
      luce:
        name: luce
        gender: f
        aliases: [candela, impronte, cera, soffittone]
        when: {flag: atto_tre}
        text: «Una luce in soffitta?» Agnese ride, ma troppo in fretta. «Sarà stato un lampo, signorina. Con questo tempo…»
        again: «Un lampo, ve l'ho detto.»
      medaglione:
        name: medaglione
        gender: m
        aliases: [stella, ciondolo]
        text: >
          «Che bella stella. La contessa la disegnava dappertutto, sapete? Sui biglietti, sui margini
          dei libri…» Agnese si morde il labbro. «Posso vederlo da vicino?»
        variants:
          - when: {flag: medaglione_mostrato}
            text: >
              «Che strana stella. La contessa la disegnava dappertutto, sapete? Sui biglietti, sui
              margini dei libri…» Agnese ti sorride. «Grazie per avermela fatta vedere, signorina.»
        again: «Me lo fate vedere?»
